server.port=8080
# --- Local dev: in-memory H2 (zero setup) ---
spring.datasource.url=jdbc:h2:mem:movies;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
# --- PostgreSQL: comment the 3 lines above and uncomment below ---
# spring.datasource.url=jdbc:postgresql://localhost:5432/movies
# spring.datasource.username=postgres
# spring.datasource.password=postgres
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always
springdoc.swagger-ui.path=/swagger-ui.html
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
